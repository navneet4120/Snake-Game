<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.menu {
    position: absolute;
    text-align: center;
}

canvas {
    display: none;
    border: 2px solid white;
    background: black;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- Intro -->
<div id="intro" class="menu">
    <h1>🐍 Snake Game</h1>
    <button id="enterBtn">Click Here</button>
</div>

<!-- Mode -->
<div id="mode" class="menu" style="display:none;">
    <h2>Select Mode</h2>
    <label><input type="radio" name="mode" value="Normal" checked> Normal</label><br>
    <label><input type="radio" name="mode" value="Fast"> Fast</label><br>
    <button id="startBtn">Start Game</button>
</div>

<!-- Game -->
<canvas id="gameCanvas" width="400" height="400"></canvas>

<div id="ui" style="display:none; text-align:center;">
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
    <button id="restartBtn" style="display:none;">Restart</button>
    <button id="modeBtn" style="display:none;">Change Mode</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const mode = document.getElementById("mode");
const enterBtn = document.getElementById("enterBtn");
const startBtn = document.getElementById("startBtn");

const restartBtn = document.getElementById("restartBtn");
const modeBtn = document.getElementById("modeBtn");

const scoreDiv = document.getElementById("score");
const highScoreDiv = document.getElementById("highScore");
const ui = document.getElementById("ui");

let snake, direction, fruit, score, gameInterval;
let gameSpeed = 200;
let gameOver = false;
let paused = false;

let modeName = "Normal";
let highScore = 0;
let highKey = "";

// INIT
function initGame(){
    snake = [{x:5,y:5}];
    direction = "RIGHT";
    fruit = spawnFruit();
    score = 0;
    gameOver = false;
    paused = false;

    restartBtn.style.display="none";
    modeBtn.style.display="none";

    draw();
}

// FRUIT
function spawnFruit(){
    return {
        x: Math.floor(Math.random()*20),
        y: Math.floor(Math.random()*20)
    };
}

// LOOP
function update(){
    if(gameOver || paused) return;

    let head = {...snake[0]};

    if(direction==="UP") head.y--;
    if(direction==="DOWN") head.y++;
    if(direction==="LEFT") head.x--;
    if(direction==="RIGHT") head.x++;

    // WALL
    if(head.x<0 || head.y<0 || head.x>=20 || head.y>=20){
        endGame(); return;
    }

    // SELF
    if(snake.some(s=>s.x===head.x && s.y===head.y)){
        endGame(); return;
    }

    snake.unshift(head);

    // EAT
    if(head.x===fruit.x && head.y===fruit.y){
        score++;
        fruit = spawnFruit();
    } else {
        snake.pop();
    }

    draw();
}

// DRAW
function draw(text=null){
    ctx.clearRect(0,0,400,400);

    // snake
    snake.forEach((s,i)=>{
        ctx.fillStyle="green";
        ctx.fillRect(s.x*20, s.y*20, 20,20);

        // eyes
        if(i===0){
            ctx.fillStyle="white";
            ctx.fillRect(s.x*20+5, s.y*20+5,5,5);
            ctx.fillRect(s.x*20+10, s.y*20+5,5,5);
        }
    });

    // fruit
    ctx.fillStyle="red";
    ctx.fillRect(fruit.x*20, fruit.y*20,20,20);

    scoreDiv.innerText="Score: "+score;
    highScoreDiv.innerText="High Score: "+highScore;

    if(text){
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.textAlign="center";
        ctx.fillText(text,200,200);
    }
}

// END
function endGame(){
    gameOver = true;

    if(score > highScore){
        highScore = score;
        localStorage.setItem(highKey, highScore);
    }

    draw("GAME OVER");

    restartBtn.style.display="inline-block";
    modeBtn.style.display="inline-block";

    clearInterval(gameInterval);
}

// CONTROLS
document.addEventListener("keydown",(e)=>{
    if(e.key==="w" && direction!=="DOWN") direction="UP";
    if(e.key==="s" && direction!=="UP") direction="DOWN";
    if(e.key==="a" && direction!=="RIGHT") direction="LEFT";
    if(e.key==="d" && direction!=="LEFT") direction="RIGHT";

    if(e.key===" "){
        paused = !paused;
        if(paused){
            draw("PAUSED");
            clearInterval(gameInterval);
        } else {
            gameInterval = setInterval(update, gameSpeed);
        }
    }
});

// FLOW
enterBtn.onclick = ()=>{
    intro.style.display="none";
    mode.style.display="block";
};

startBtn.onclick = ()=>{
    modeName = document.querySelector('input[name="mode"]:checked').value;

    gameSpeed = (modeName==="Normal") ? 200 : 100;

    highKey = "snake_"+modeName;
    highScore = localStorage.getItem(highKey) ? parseInt(localStorage.getItem(highKey)) : 0;

    mode.style.display="none";
    canvas.style.display="block";
    ui.style.display="block";

    initGame();

    let count=3;
    draw(count);

    let cd = setInterval(()=>{
        count--;
        if(count>0) draw(count);
        else if(count===0) draw("GO!");
        else{
            clearInterval(cd);
            gameInterval = setInterval(update, gameSpeed);
        }
    },1000);
};

restartBtn.onclick = ()=>{
    initGame();
    gameInterval = setInterval(update, gameSpeed);
};

modeBtn.onclick = ()=>{
    canvas.style.display="none";
    ui.style.display="none";
    mode.style.display="block";
};
</script>

</body>
</html>
